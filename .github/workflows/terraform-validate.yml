# Valida el Terraform en cada push y pull request (pipeline sano: sirve de contraste).
name: terraform-validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Formato
        run: terraform fmt -check -recursive
      - name: Inicializar (sin backend)
        run: terraform init -backend=false -input=false
      - name: Validar
        run: terraform validate
